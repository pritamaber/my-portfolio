<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pritamfavicon.ico" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link href="/src/index.css" rel="stylesheet" />

    <!-- Basic Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pritam Das | Software Developer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Pritam Das, a passionate software developer building modern web applications with React, JavaScript, and fullstack technologies."
    />
    <meta
      name="keywords"
      content="Pritam Das, Software Developer, React Developer, JavaScript, Portfolio, Web Development, Fullstack Developer, India"
    />
    <meta name="author" content="Pritam Das" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph for Social Sharing -->
    <meta
      property="og:title"
      content="Pritam Das | Software Developer Portfolio"
    />
    <meta
      property="og:description"
      content="Explore Pritam Das' developer portfolio showcasing projects built with React, JavaScript, and modern web technologies."
    />
    <meta
      property="og:image"
      content="https://yourdomain.com/preview-image.jpg"
    />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Pritam Das | Software Developer Portfolio"
    />
    <meta
      name="twitter:description"
      content="Explore Pritam Das' portfolio, a passionate React and fullstack developer."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/preview-image.jpg"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
